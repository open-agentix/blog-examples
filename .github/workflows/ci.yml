name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: harness-node (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: harness-node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Test with coverage (every file in src/ must reach 80 % of lines)
        run: |
          node --test --experimental-test-coverage 2>&1 | tee coverage.txt
          awk -F'|' '/\.js +\|/ && !/test|helpers/ { v = $2; gsub(/ /, "", v); n++; if (v + 0 < 80) { print "low coverage: " $1; bad = 1 } }
                     END { if (n == 0 || bad) exit 1 }' coverage.txt
      - name: Demo
        run: npm run demo

  java:
    name: harness-java (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness-java
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test with coverage (build fails below 80 % of lines)
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Demo
        run: ./run-demo.sh
